[project]
name = "chive-shared"
version = "0.1.0"
description = "Shared storage models + API schemas for CHIVE V2 (chive-backend + chive-pipeline)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chive_shared"]
